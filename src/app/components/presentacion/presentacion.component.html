<section class="card mb-4">
  <div class="card-body">
    <h1 class="card-title h2">{{ estudiante.nombre }}</h1>
    <h2 class="h5 text-body-secondary">{{ estudiante.carrera }} - {{ estudiante.semestre }}</h2>
    <p class="mb-1">{{ estudiante.universidad }}</p>
    <p class="mb-3"><strong>Código:</strong> {{ estudiante.codigo }}</p>
    <h3 class="h6">Perfil profesional</h3>
    <p class="mb-0">{{ estudiante.perfil }}</p>
  </div>
</section>
